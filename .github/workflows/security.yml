name: Security Scans & Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security audit every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Token Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Node Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm audit --audit-level=high
          else
            echo "No package-lock.json found. Skipping npm audit."
          fi

      - name: Audit Python Dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install pip-audit
            pip-audit -r requirements.txt
          else
            echo "No requirements.txt found. Skipping pip-audit."
          fi

  codeql-analysis:
    name: CodeQL Static Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
